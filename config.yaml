name: "Gundam Brain"
version: "1.3.9"
slug: "gundam_brain"
description: "Headless Antigravity agent server connecting to remote network MCP endpoints"
url: "https://github.com/azylman/gundam-brain"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
map: []
ports:
  8080/tcp: 8088
ports_description:
  8080/tcp: Webhook endpoint
options:
  port: 8080
  api_key: ""
  model: "Gemini 3.6 Flash (Low)"
  system_prompt: ""
  timeout_minutes: 15
  agy_bin: "agy"
  mcp_config: ""
schema:
  port: int
  api_key: "str?"
  model: "str?"
  system_prompt: "str?"
  timeout_minutes: "int?"
  agy_bin: "str?"
  mcp_config: "str?"
